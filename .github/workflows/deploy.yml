name: Deploy to GitHub Pages

on:
  # Avvia l'azione ogni volta che fai push sul branch main
  push:
    branches: ['main']
  # Permette di lanciare il workflow manualmente da GitHub
  workflow_dispatch:

# Imposta i permessi per il GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Permette un solo deployment simultaneo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Carichiamo la directory generata dalla build (dist)
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
